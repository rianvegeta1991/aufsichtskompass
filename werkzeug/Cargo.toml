[package]
name = "kompass-werkzeug"
version = "0.1.0"
edition = "2024"
description = "Konnektoren, Change-Detection und Indexbau fuer den Aufsichtskompass"

[[bin]]
name = "kompass"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "charset", "gzip"] }
scraper = "0.24"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
